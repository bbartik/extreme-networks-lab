# Cloud Config Groups (/ccgs — confirmed real, WORKING, writable endpoint:
# POST,GET,HEAD,OPTIONS, found live 2026-08-16 after ~15 wrong guesses at
# more obvious names like /cloud-config-groups). Schema confirmed live off
# real objects: {name, description, zone_name, zone_id, zone_location_id,
# device_ids: []}. This tenant already has 8 auto-generated by-model
# groups (Model_FabricEngine_5320_16P_4XE, etc — read_only: true, one of
# them already contains the real CORE-SW1 switch's device id). Ours are
# user-created device groups, one per site format, matching the
# BB-SG-* site-group categories.
#
# device_ids is empty for every group below — no real hardware has been
# claimed into any BB- site yet (same scope boundary as the rest of this
# repo — see README "Deploying real hardware"). Once a real AP/switch is
# claimed into e.g. a retail site, its device id goes into
# BB-CCG-Retail's device_ids for it to actually match BB-Rule-Retail (see
# classification_rules.yaml).
#
# CONFIRMED LIVE 2026-08-16, the hard way: a CCG cannot actually be
# CREATED with an empty device_ids array — POST /ccgs 400's with
# "cloudconfiggroup.vo.validator.missing.device.ids" if you try. That
# means none of the groups below can exist until real hardware is
# claimed into a BB- site — push.py skips them cleanly rather than
# sending a request known to fail. This is the same "needs real hardware
# first" boundary that already blocks Site creation and, indirectly,
# SSID configuration — it's now hit a third object type.
#
# Retail standalone + mall share ONE group here, matching how they
# already share SSIDs/policy — same reasoning as the rest of this repo's
# retail-format handling.

cloud_config_groups:
  - name: BB-CCG-DistributionCenter
    description: "BB retail lab - Distribution Center devices - safe to delete"
    device_ids: []
  - name: BB-CCG-CorporateOffice
    description: "BB retail lab - Corporate Office devices - safe to delete"
    device_ids: []
  - name: BB-CCG-Retail
    description: "BB retail lab - Retail (standalone + mall) devices - safe to delete"
    device_ids: []
  - name: BB-CCG-PopUp
    description: "BB retail lab - Pop-up devices - safe to delete"
    device_ids: []
