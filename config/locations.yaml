# Locations — equivalent of Mist's site_groups.yaml + sites.yaml combined
# into one file, because Platform ONE's Global View location tree (Site
# Group > Site > Building > Floor) already IS the grouping mechanism,
# rather than Mist's flat sites + separate sitegroup_ids tagging.
#
# CONFIRMED LIVE (2026-08-15) against a real tenant: Site Group IS a real,
# distinct object type in the tree (seen live: "type": "Site_Group") and
# it nests arbitrarily (this tenant's own real tree is two Site_Groups
# deep before the first Site). The tree really is Site Group > Site >
# Building > Floor, and GET /locations/tree works and returns it.
#
# CONFIRMED LIVE by actually writing (2026-08-15, second pass): all
# location CRUD — Site Group, Site, Building, Floor alike — goes through
# ONE generic pair of paths: POST /locations to create (a `type` field
# disambiguates which kind), PUT /locations/{id} to update. The
# type-named paths (/locations/sites, /locations/site-groups, etc.) reject
# GET outright, and even though their own OPTIONS response claims to allow
# PUT/DELETE, a live PUT against /locations/site-groups/{id} 404's — not a
# real route, just a misleading Allow header. Listing existing objects for
# upsert-by-name matching goes through /locations/tree instead (filter
# nodes by type) — see p1_client.py.
#
# Also confirmed: POST /locations requires a real parent_id (NotNull) —
# there's no way to create a true new root. This tenant already has one
# real root Site_Group of its own; push.py attaches every BB- site group
# as a new sibling under that existing root rather than trying to create
# one. site_group below is used both for this repo's own bookkeeping
# (site_defaults, which device template/policy a site ends up on) AND now
# genuinely sent as each site's real parent_id.
#
# CORRECTED 2026-08-16: a device can only be claimed into a Building or
# Floor, NOT directly into a Site — Site alone isn't a valid claim target.
# This means Building/Floor aren't optional depth this lab was choosing to
# skip (as the first draft assumed); they're required for the "deploy
# real hardware" story to ever work at all. Every site below gets exactly
# one building (default name "Main", overridable per site via `building:`)
# and one floor under it (default "1", overridable via `floor:`) — the
# minimum needed for a device to have somewhere real to attach. No site
# below overrides the default; the field only exists for when one needs to.
#
# RESOLVED 2026-08-16. The `type`-field-ignored bug on the generic
# /locations endpoint was real but turned out to be beside the point: SITE/
# BUILDING/FLOOR were never reachable through that endpoint at all — they
# have their own typed collection paths (POST/GET /locations/site,
# /locations/building, /locations/floor, singular), confirmed from two
# already-working reference scripts the user supplied
# (.docs/xiq_sites.py, .docs/xiq_add_buildings_and_floors.py — real
# production automation predating this lab). All 10 sites below now exist
# live as true SITE nodes, each with one real Building ("Main") and one
# real Floor ("1") under it, confirmed via a fresh GET after push (not
# just the write response) — see push.py's upsert_typed_location and
# ENGINEERING-NOTES.md for the full story, including the address-parsing
# and duplicate-folder-name snags hit along the way.

# Applied to every site unless overridden per-site with building:/floor:.
default_building_name: "Main"
default_floor_name: "1"

site_groups:
  - name: BB-SG-DistributionCenters
  - name: BB-SG-CorporateOffices
  - name: BB-SG-RetailStandalone
  - name: BB-SG-RetailMall
  - name: BB-SG-PopUpStores

# site_defaults: per-group fallback values, same convenience pattern as the
# Mist repo — a site only states what's actually specific to it.
#
# network_policy is the same BB-NP-Lab everywhere now — collapsed to
# one org-wide policy on 2026-08-15 (see network_policies.yaml header for
# why). Only device_template_ap (and, through it, the radio profile) still
# varies per format — that's still real, unaffected by the policy collapse.
site_defaults:
  BB-SG-DistributionCenters:
    country_code: US
    device_template_ap: BB-DT-DistributionCenter-AP
    network_policy: BB-NP-Lab
  BB-SG-CorporateOffices:
    country_code: US
    device_template_ap: BB-DT-CorporateOffice-AP
    network_policy: BB-NP-Lab
  BB-SG-RetailStandalone:
    country_code: US
    device_template_ap: BB-DT-RetailStandalone-AP
    network_policy: BB-NP-Lab
  BB-SG-RetailMall:
    country_code: US
    device_template_ap: BB-DT-RetailMall-AP
    network_policy: BB-NP-Lab
  BB-SG-PopUpStores:
    country_code: US
    device_template_ap: BB-DT-PopUp-AP
    network_policy: BB-NP-Lab

sites:

  - name: BB-DC-Dallas-01
    site_group: BB-SG-DistributionCenters
    address: "Dallas, TX, USA"
    timezone: America/Chicago
    notes: "BB retail lab - Distribution Center - safe to delete"

  - name: BB-DC-Reno-02
    site_group: BB-SG-DistributionCenters
    address: "Reno, NV, USA"
    timezone: America/Los_Angeles
    notes: "BB retail lab - Distribution Center (western regional DC) - safe to delete"

  - name: BB-Corp-Austin-HQ
    site_group: BB-SG-CorporateOffices
    address: "Austin, TX, USA"
    timezone: America/Chicago
    notes: "BB retail lab - Corporate HQ - safe to delete"

  - name: BB-Corp-Chicago-Regional
    site_group: BB-SG-CorporateOffices
    address: "Chicago, IL, USA"
    timezone: America/Chicago
    notes: "BB retail lab - Regional office - safe to delete"

  - name: BB-Retail-Denver-0142
    site_group: BB-SG-RetailStandalone
    address: "Denver, CO, USA"
    timezone: America/Denver
    notes: "BB retail lab - Standalone store #0142 - safe to delete"
    vars:
      store_number: "0142"
      # pos_psk lives in config/secrets.yaml (gitignored), keyed by this site name

  - name: BB-Retail-Columbus-0210
    site_group: BB-SG-RetailStandalone
    address: "Columbus, OH, USA"
    timezone: America/New_York
    notes: "BB retail lab - Standalone store #0210 - safe to delete"
    vars:
      store_number: "0210"

  - name: BB-Retail-Mall-Scottsdale-0087
    site_group: BB-SG-RetailMall
    address: "Scottsdale Fashion Square, Scottsdale, AZ, USA"
    timezone: America/Phoenix
    notes: "BB retail lab - Mall-colocated store #0087 - safe to delete"
    vars:
      store_number: "0087"

  - name: BB-Retail-Mall-KingOfPrussia-0311
    site_group: BB-SG-RetailMall
    address: "King of Prussia Mall, King of Prussia, PA, USA"
